<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#165a66" />
    <title>Papa Libro — catálogo de libros</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="assets/branding/vhe-emblem.png" />
  </head>
  <body>
    <a class="skip-link" href="#main">Ir al contenido principal</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegación principal">
        <div class="brand"><img class="brand-mark" src="assets/branding/vhe-emblem.png" alt="Emblema de VhEscribano" /><span>Papa Libro</span></div>
        <nav class="main-nav">
          <button class="nav-item active" data-view="inicio"><span>⌂</span> Inicio</button>
          <button class="nav-item" data-view="catalogo"><span>▤</span> Catálogo <b id="nav-count">0</b></button>
          <button class="nav-item" data-view="colecciones"><span>▱</span> Colecciones</button>
          <button class="nav-item" data-view="prestamos"><span>↔</span> Préstamos <b id="loan-count">0</b></button>
          <button class="nav-item" data-view="ayuda"><span>?</span> Ayuda</button>
        </nav>
        <div class="sidebar-bottom">
          <button class="nav-item" data-view="copias"><span>▦</span> Inventario</button>
          <button class="nav-item" data-view="ajustes"><span>⚙</span> Datos y ajustes</button>
          <p>Una creación de <a class="brand-link" href="https://vhescribano.com/" target="_blank" rel="noopener noreferrer">VhEscribano</a>.<br />Funciona sin cuenta.<br />Tus datos son tuyos.</p>
        </div>
      </aside>
      <main id="main" tabindex="-1">
        <header class="topbar">
          <button class="menu-button" aria-label="Abrir menú">☰</button>
          <label class="global-search"><span>⌕</span><input id="global-search" type="search" placeholder="Busca por título, autor, ISBN o etiqueta…" /><kbd>Ctrl K</kbd></label>
          <label class="language-picker"><span class="sr-only">Idioma</span><select id="language-select" aria-label="Idioma"><option value="es">ES</option><option value="en">EN</option><option value="fr">FR</option><option value="pt">PT</option></select></label>
          <button class="icon-button" id="quick-add" title="Añadir un libro">＋<span>Añadir</span></button>
        </header>
        <div id="content"></div>
      </main>
    </div>

    <dialog id="book-dialog" class="dialog wide-dialog"></dialog>
    <dialog id="simple-dialog" class="dialog"></dialog>
    <input id="import-file" type="file" accept="application/json,.json,text/csv,.csv" hidden />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
